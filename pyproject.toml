[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "getpiccoma"
description = "Retrieve and save images from manga distribution sites using Piccoma."
readme = "README.md"
keywords = [
  "cli",
  "downloader",
  "japanese",
  "manga",
  "manga-downloader",
  "piccoma",
  "scraping",
]
license = { text = "MIT" }
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12",
  "pathvalidate>=3.2",
  "pillow>=10.4",
  "requests>=2.32",
  "rich>=13.7",
]
urls.Documentation = "https://eggplants.github.io/getpiccoma/"
urls.Issues = "https://github.com/eggplants/getpiccoma/issues"
urls.Repository = "https://github.com/eggplants/getpiccoma"
scripts.getpiccoma = "getpiccoma.cli:main"
scripts.pget = "getpiccoma.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-cov>=7",
  "pytest-mock>=3.14",
  "types-requests>=2.32",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "getpiccoma" ]
build.targets.sdist.packages = [ "getpiccoma" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D",
]
lint.per-file-ignores."getpiccoma/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."packaging/entrypoint.py" = [
  "INP001", # Implicit namespace package (frozen entry point, not importable content)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "CPY001",  # Missing copyright notice
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
]
# Piccoma separates the parts of a page title with a fullwidth bar, so the
# parser and its fixtures have to spell it the way the site does.
lint.allowed-confusables = [ "｜" ]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
